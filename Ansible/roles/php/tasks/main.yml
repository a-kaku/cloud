- name: Reset PHP modules
  command: dnf dodule reste php -y

- name: Enable PHP modules
  command: dnf module enable php:{{ php_version }} -y

- name: Install PHP packages
  ansible.builtin.dnf:
    name: "{{ php_packages }}"
    state: latest

- name: Enable and start php-fpm
  ansible.builtin.systemd:
    name: php-fpm
    enabled: true
    state: started