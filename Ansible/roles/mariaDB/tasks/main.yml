- name: Install PyMySQL package
  dnf:
    name: python3-PyMySQL
    state: present

- name: Enable MariaDB module stream
  ansible.builtin.command:
    cmd: "dnf module enable mariadb:{{ mariadb_module_stream }} -y"
  register: mariadb_module_enable
  changed_when: "'Nothing to do' not in mariadb_module_enable.stdout"

- name: Install mariaDB package
  ansible.builtin.dnf:
    name: "{{ mariadb_package }}"
    state: present

- name: Deploy mariadb configuration file
  ansible.builtin.template:
    src: my.cnf.j2
    dest: /etc/my.cnf.d/server.cnf
    owner: root
    group: root
    mode: '0644'
  notify:
    - restart mariadb

- name: Enable mariadb service
  ansible.builtin.systemd:
    name: "{{ mariadb_service }}"
    state: started
    enabled: true

- name: Initialize mariadb root password
  community.mysql.mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    host: localhost
    state: present